[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# кэшируем видео и картинки надолго (ускоряет повторные загрузки)
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"

[[headers]]
  for = "/chess/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
